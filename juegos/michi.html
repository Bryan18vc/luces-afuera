<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Michi Online · Arcadia</title>
<link rel="stylesheet" href="../css/global.css">
<style>
.game{max-width:650px;margin:40px auto}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.cell{aspect-ratio:1;border:1px solid var(--border);border-radius:18px;background:#0b1a2e;color:var(--text);font-size:clamp(40px,10vw,72px);font-weight:900}
.cell:hover{background:#122944}
.room{font-size:30px;letter-spacing:.15em;font-weight:900}
.status{padding:12px;border-radius:12px;background:rgba(255,255,255,.04)}
.reward{margin-top:10px;padding:12px;border-radius:12px;background:rgba(88,227,155,.08);border:1px solid rgba(88,227,155,.2)}
</style>
</head>
<body>
<header class="shell topbar">
  <a class="logo" href="../index.html">ARC<span>ADIA</span></a>
  <nav class="nav"><a href="../index.html">Menú</a><a href="../perfil.html">Perfil</a></nav>
</header>

<main class="shell game">
<section class="card">
  <h1>⭕❌ Michi Online</h1>
  <p class="muted">Juega en tiempo real con otra persona y gana experiencia.</p>

  <div class="row">
    <button class="btn primary" id="create">Crear sala</button>
    <input id="code" maxlength="6" placeholder="CÓDIGO">
    <button class="btn" id="join">Unirse</button>
  </div>

  <p class="muted">Tu símbolo: <b id="mark">—</b></p>
  <div id="roomBox" class="status">Sin sala</div>
  <div id="status" class="status" style="margin-top:10px">Conecta una sala para comenzar.</div>
  <div id="reward" class="reward" style="display:none"></div>

  <div class="board" id="board"></div>

  <div class="row">
    <button class="btn" id="rematch">Nueva partida</button>
    <button class="btn danger" id="leave">Salir de sala</button>
  </div>
</section>
</main>

<script type="module">
import {auth,rtdb} from "../js/firebase.js";
import {watchAuth,ensureProfile} from "../js/auth.js";
import {awardGameResult} from "../js/progress.js";
import {ref,set,get,onValue,update,runTransaction} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const boardEl=document.querySelector("#board");
const markEl=document.querySelector("#mark");
const roomBox=document.querySelector("#roomBox");
const statusEl=document.querySelector("#status");
const rewardEl=document.querySelector("#reward");

let roomId="",myMark="",data=null,gameListener=null;
let awardedGames=new Set();

const empty=()=>Array(9).fill("");
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,4,8],[2,4,6]];

const win=b=>{
  const line=lines.find(x=>b[x[0]]&&b[x[0]]===b[x[1]]&&b[x[1]]===b[x[2]]);
  return line ? b[line[0]] : null;
};

function render(){
  markEl.textContent=myMark||"—";
  roomBox.textContent=roomId?`Sala: ${roomId}`:"Sin sala";

  if(!data){
    statusEl.textContent="Conecta una sala para comenzar.";
    return;
  }

  const board=Array.isArray(data.board)?data.board:empty();
  board.forEach((v,i)=>{ boardEl.children[i].textContent=v; });

  if(data.status==="playing"){
    statusEl.textContent=`Turno: ${data.turn}`;
  }else if(data.status==="won"){
    statusEl.textContent=`Ganó ${data.winner}`;
  }else{
    statusEl.textContent="Empate";
  }

  if(data.status!=="playing"){
    processResult(data);
  }
}

async function processResult(result){
  const gameId=result.gameId;
  if(!gameId || !auth.currentUser || !myMark) return;

  const localKey=`michi_${roomId}_${gameId}_${auth.currentUser.uid}`;
  if(awardedGames.has(localKey)) return;
  awardedGames.add(localKey);

  let xp=20, coins=3, winResult=false;

  if(result.status==="won"){
    if(result.winner===myMark){
      xp=100; coins=20; winResult=true;
    }else{
      xp=20; coins=3;
    }
  }else if(result.status==="draw"){
    xp=40; coins=8;
  }

  try{
    const reward=await awardGameResult({
      userId:auth.currentUser.uid,
      eventId:localKey,
      xp,
      coins,
      win:winResult,
      game:"michi"
    });

    if(reward.alreadyAwarded) return;

    rewardEl.style.display="block";
    rewardEl.textContent=`🎉 +${reward.xpGained} XP · +${reward.coinsGained} monedas` +
      (reward.newLevel>reward.oldLevel ? ` · ⬆️ ¡Subiste al nivel ${reward.newLevel}!` : "");
  }catch(error){
    console.error("Error registrando recompensa:",error);
    awardedGames.delete(localKey);
    rewardEl.style.display="block";
    rewardEl.textContent="⚠️ La partida terminó, pero no se pudo guardar la recompensa.";
  }
}

function listen(){
  if(gameListener) gameListener();
  gameListener=onValue(ref(rtdb,"rooms/"+roomId),s=>{
    data=s.val();
    render();
  });
}

function newGameId(){
  return Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}

function randomCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

async function createRoom(){
  roomId=randomCode();
  myMark="X";
  rewardEl.style.display="none";

  await set(ref(rtdb,"rooms/"+roomId),{
    board:empty(),
    turn:"X",
    status:"playing",
    winner:null,
    playerX:auth.currentUser.uid,
    playerO:null,
    moveCount:0,
    gameId:newGameId()
  });

  listen();
}

async function joinRoom(){
  const c=document.querySelector("#code").value.trim().toUpperCase();
  if(!c){statusEl.textContent="Escribe el código de la sala.";return}

  const snap=await get(ref(rtdb,"rooms/"+c));
  if(!snap.exists()){statusEl.textContent="Sala no encontrada.";return}

  const r=snap.val();
  if(r.playerO && r.playerO!==auth.currentUser.uid){
    statusEl.textContent="La sala está llena.";
    return;
  }

  roomId=c;
  myMark="O";
  rewardEl.style.display="none";

  await update(ref(rtdb,"rooms/"+c),{playerO:auth.currentUser.uid});
  listen();
}

async function play(i){
  if(!data||data.status!=="playing"||data.turn!==myMark||data.board[i])return;

  await runTransaction(ref(rtdb,"rooms/"+roomId),cur=>{
    if(!cur||cur.status!=="playing"||cur.turn!==myMark||cur.board[i])return;

    const b=Array.isArray(cur.board)?cur.board.slice():empty();
    b[i]=myMark;

    const w=win(b);
    const n=b.filter(Boolean).length;

    return {
      ...cur,
      board:b,
      moveCount:n,
      turn:(w||n===9)?cur.turn:(myMark==="X"?"O":"X"),
      status:w?"won":n===9?"draw":"playing",
      winner:w?myMark:null
    };
  });
}

for(let i=0;i<9;i++){
  const c=document.createElement("button");
  c.className="cell";
  c.type="button";
  c.onclick=()=>play(i);
  boardEl.appendChild(c);
}

document.querySelector("#create").onclick=createRoom;
document.querySelector("#join").onclick=joinRoom;

document.querySelector("#rematch").onclick=async()=>{
  if(!roomId||!data)return;

  rewardEl.style.display="none";

  await update(ref(rtdb,"rooms/"+roomId),{
    board:empty(),
    turn:"X",
    status:"playing",
    winner:null,
    moveCount:0,
    gameId:newGameId()
  });
};

document.querySelector("#leave").onclick=()=>{
  if(gameListener) gameListener();
  gameListener=null;
  roomId="";
  myMark="";
  data=null;
  rewardEl.style.display="none";
  render();
};

watchAuth(async user=>{
  if(!user){
    location.href="../login.html";
    return;
  }
  await ensureProfile(user);
});
</script>
</body>
</html>
