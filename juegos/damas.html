<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcadia · Damas</title>
<style>
:root{--a:#6d5dfc;--bg:#f4f6fb;--card:#fff;--tx:#182033;--mut:#667085;--light:#f2e4c8;--dark:#7b4d3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.page{width:min(1080px,95vw);margin:auto;padding:22px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:32px;font-weight:900}.sub,.help,.msg{color:var(--mut);font-size:14px}.layout{display:grid;grid-template-columns:minmax(320px,650px) minmax(250px,1fr);gap:20px}.card{background:var(--card);border:1px solid #e4e7ec;border-radius:20px;padding:18px;box-shadow:0 8px 28px #10182810}.board{width:min(88vw,600px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #242832;border-radius:14px;overflow:hidden;margin:auto}.sq{border:0;border-radius:0;padding:0;display:grid;place-items:center;position:relative}.light{background:var(--light)}.dark{background:var(--dark)}.selected{outline:4px solid #ffe066;outline-offset:-4px}.legal:after{content:"";width:25%;height:25%;border-radius:50%;background:#fff9}.capture:after{background:#ffe066}.piece{width:76%;height:76%;border-radius:50%;border:3px solid #0004;box-shadow:inset 0 -7px #0003,0 4px 7px #0004}.red{background:#d94b4b}.black{background:#222831}.king:after{content:"♛";display:grid;place-items:center;height:100%;font-size:clamp(16px,4vw,28px);color:#fff}.status,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{justify-content:space-between;margin-bottom:12px}.badge{background:#f0f2f6;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f7f8fb;border-radius:12px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mut)}button,input{font:inherit}button{min-height:44px;border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary,.mode{background:#eef0f6;color:var(--tx)}.mode{width:100%;text-align:left;border:1px solid #e4e7ec;padding:15px}.mode strong,.mode span{display:block}.mode span{font-size:13px;color:var(--mut);margin-top:3px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form{display:grid;gap:9px}.form input{width:100%;min-height:46px;border:1px solid #e4e7ec;border-radius:12px;padding:10px}.room{font-size:28px;letter-spacing:6px;font-weight:900;text-align:center;background:#f7f5ff;padding:14px;border-radius:14px;margin:10px 0}.hidden{display:none!important}
@media(max-width:760px){.page{width:96vw;padding-top:14px}.layout{grid-template-columns:1fr}.card{padding:14px;border-radius:16px}.board{width:min(94vw,600px);border-width:5px}.brand{font-size:27px}}@media(max-width:380px){.grid2{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:7px 3px}}
</style></head><body><main class="page"><header class="top"><div><div class="brand">♟️ Damas</div><div class="sub">Arcadia · máquina o sala</div></div><button class="secondary" id="back">← Menú</button></header>
<section class="layout"><div class="card"><div class="status"><span class="badge" id="mode">Elige un modo</span><span class="badge" id="turn">—</span></div><div id="board" class="board"></div><div class="stats"><div class="stat"><b id="r">12</b><span>Rojas</span></div><div class="stat"><b id="b">12</b><span>Negras</span></div><div class="stat"><b id="moves">0</b><span>Movimientos</span></div></div><div class="msg" id="msg">Selecciona una modalidad.</div><div class="actions" style="margin-top:12px"><button class="primary" id="new">Nueva partida</button><button class="secondary" id="leave">Salir</button></div></div>
<aside class="card"><div id="home"><h3>¿Cómo quieres jugar?</h3><div class="grid2"><button class="mode" id="ai"><strong>🤖 Máquina</strong><span>Fácil · Normal · Difícil</span></button><button class="mode" id="online"><strong>🌐 Sala</strong><span>Crear o unirse</span></button></div><p class="help">Incluye capturas obligatorias, capturas múltiples y coronación.</p></div>
<div id="aip" class="hidden"><h3>🤖 Contra la máquina</h3><p class="help">Tú juegas con rojas.</p><div class="grid2"><button class="secondary lev" data-l="easy">Fácil</button><button class="secondary lev" data-l="normal">Normal</button><button class="secondary lev" data-l="hard">Difícil</button></div><button class="secondary" id="home1" style="margin-top:10px">← Cambiar</button></div>
<div id="op" class="hidden"><h3>🌐 Jugar en sala</h3><button class="primary" id="create">Crear sala</button><div class="form" style="margin-top:10px"><input id="code" maxlength="6" placeholder="Código de sala"><button class="secondary" id="join">Unirse a sala</button></div><div id="room"></div><button class="secondary" id="home2" style="margin-top:10px">← Cambiar</button></div></aside></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,onAuthStateChanged,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getDatabase,ref,onValue,set,update,runTransaction,off}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const C={apiKey:"AIzaSyDmq74BLw4PlUy6Bu6X9HnsvOeMEoQvN9x8",authDomain:"michi-online-a66e1.firebaseapp.com",databaseURL:"https://michi-online-a66e1-default-rtdb.firebaseio.com/",projectId:"michi-online-a66e1",storageBucket:"michi-online-a66e1.firebasestorage.app",messagingSenderId:"667003559125",appId:"1:667003559125:web:f5767fa0b52ec744c4d65c"},A=initializeApp(C),auth=getAuth(A),rt=getDatabase(A),fs=getFirestore(A),$=id=>document.getElementById(id);
const E=0,R=1,B=2,RK=3,BK=4;let bd=[],sel=-1,forced=-1,mode="",level="normal",room="",side=R,unsub=null,user=null,thinking=false,over=false,mcount=0;
const rc=i=>[i>>3,i&7],ix=(r,c)=>r*8+c,inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8,so=p=>p===R||p===RK?R:p===B||p===BK?B:0,king=p=>p===RK||p===BK,opp=s=>s===R?B:R;
function init(){let b=Array(64).fill(0);for(let r=0;r<3;r++)for(let c=0;c<8;c++)if((r+c)%2)b[ix(r,c)]=B;for(let r=5;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2)b[ix(r,c)]=R;return b}
function dirs(p){return king(p)?[[-1,-1],[-1,1],[1,-1],[1,1]]:so(p)===R?[[-1,-1],[-1,1]]:[[1,-1],[1,1]]}
function caps(b,f){let p=b[f],out=[];if(!p)return out;let[r,c]=rc(f);for(let[d,e]of dirs(p)){let mr=r+d,mc=c+e,tr=r+2*d,tc=c+2*e;if(inb(tr,tc)&&so(b[ix(mr,mc)])===opp(so(p))&&b[ix(tr,tc)]===E&&inb(mr,mc))out.push({from:f,to:ix(tr,tc),rm:ix(mr,mc)})}return out}
function simple(b,f){let p=b[f],out=[];if(!p)return out;let[r,c]=rc(f);for(let[d,e]of dirs(p)){let tr=r+d,tc=c+e;if(inb(tr,tc)&&b[ix(tr,tc)]===E)out.push({from:f,to:ix(tr,tc),rm:-1})}return out}
function legal(b,s,only=-1){let a=[];for(let i=0;i<64;i++)if(so(b[i])===s)a.push(...caps(b,i));if(a.length)return only<0?a:a.filter(x=>x.from===only);if(only>=0)return simple(b,only);let m=[];for(let i=0;i<64;i++)if(so(b[i])===s)m.push(...simple(b,i));return m}
function apply(b,m){let n=b.slice(),p=n[m.from];n[m.from]=E;n[m.to]=p;if(m.rm>=0)n[m.rm]=E;let[r]=rc(m.to);if(p===R&&r===0)n[m.to]=RK;if(p===B&&r===7)n[m.to]=BK;return n}
function draw(){let ls=sel>=0?legal(bd,so(bd[sel]),sel):[];$("board").innerHTML="";for(let i=0;i<64;i++){let s=document.createElement("button");s.className="sq "+(((i>>3)+(i&7))%2?"dark":"light");if(i===sel)s.classList.add("selected");let m=ls.find(x=>x.to===i);if(m){s.classList.add("legal");if(m.rm>=0)s.classList.add("capture")}if(bd[i]){let q=document.createElement("span");q.className="piece "+(so(bd[i])===R?"red":"black")+(king(bd[i])?" king":"");s.append(q)}s.onclick=()=>click(i);$("board").append(s)}let rr=bd.filter(x=>so(x)===R).length,bb=bd.filter(x=>so(x)===B).length;$("r").textContent=rr;$("b").textContent=bb;$("moves").textContent=mcount;$("mode").textContent=mode==="ai"?"🤖 "+level:mode==="online"?"🌐 Sala":"Elige un modo";$("turn").textContent=mode==="ai"?(thinking?"Máquina…":"Tu turno"):(mode==="online"?(side===R?"Rojas · tú":"Negras · tú"):"—")}
function click(i){if(over||thinking)return;let s=mode==="ai"?R:side;if(sel>=0){let m=legal(bd,s,sel).find(x=>x.to===i);if(m)return mode==="online"?send(m):play(m)}if(so(bd[i])===s&&(forced<0||i===forced)){sel=i;draw()}}
function play(m){bd=apply(bd,m);mcount++;let p=bd[m.to],cont=m.rm>=0&&!king(p)&&caps(bd,m.to).length;sel=-1;forced=cont?m.to:-1;draw();if(end(so(p)))return;if(mode==="ai"){thinking=true;draw();setTimeout(ai,350)}}
function end(moved){let n=opp(moved);if(!legal(bd,n).length||!bd.some(x=>so(x)===n)){over=true;thinking=false;$("msg").textContent=moved===R?"¡Ganaste!":"¡Ganó la máquina!";if(mode==="ai"&&user&&!user.isAnonymous)reward(moved===R)}return over}
function ai(){let ms=legal(bd,B);if(!ms.length)return end(R);let m;if(level==="easy")m=ms[Math.floor(Math.random()*ms.length)];else if(level==="normal"){let capsms=ms.filter(x=>x.rm>=0);m=(capsms[0]||ms.find(x=>{let[r,c]=rc(x.to);return r>1&&r<6&&c>1&&c<6})||ms[0])}else{let best=ms[0],bs=-1e9;for(let x of ms){let n=apply(bd,x),v=score(n,3);if(v>bs)bs=v,best=x}m=best}thinking=false;play(m)}
function score(b,d){let v=0;for(let i=0;i<64;i++){let p=b[i];if(!p)continue;let[r,c]=rc(i),z=king(p)?180:100;z+=so(p)===B?r*4:(7-r)*4;if(c===0||c===7)z-=3;v+=so(p)===B?z:-z}if(!d)return v;let ms=legal(b,B);if(!ms.length)return-99999;for(let x of ms)v=Math.max(v,score(apply(b,x),d-1));return v}
function startAI(l){mode="ai";level=l;room="";if(unsub)unsub();unsub=null;bd=init();sel=-1;forced=-1;mcount=0;over=false;thinking=false;$("home").classList.add("hidden");$("op").classList.add("hidden");$("aip").classList.remove("hidden");$("msg").textContent="Tu turno. Selecciona una ficha roja.";draw()}
function online(){mode="online";$("home").classList.add("hidden");$("aip").classList.add("hidden");$("op").classList.remove("hidden");$("msg").textContent="Crea una sala o únete con un código.";draw()}
async function createRoom(){side=R;room=Math.random().toString(36).slice(2,8).toUpperCase();await set(ref(rt,"rooms/damas/"+room),{game:"damas",board:init(),turn:R,redUid:user.uid,blackUid:null,status:"waiting",forced:-1,moveCount:0});listen();$("room").innerHTML='<div class="room">'+room+'</div><div class="help">Comparte este código.</div>'}
async function joinRoom(){let c=$("code").value.trim().toUpperCase();let rr=ref(rt,"rooms/damas/"+c),snap=await new Promise(res=>onValue(rr,res,{onlyOnce:true}));if(!snap.exists())return $("msg").textContent="Sala no encontrada.";let d=snap.val();if(d.blackUid&&d.blackUid!==user.uid)return $("msg").textContent="Sala llena.";side=B;room=c;await update(rr,{blackUid:user.uid,status:"playing"});listen();$("room").innerHTML='<div class="room">'+c+'</div><div class="help">Sala activa.</div>'}
function listen(){let rr=ref(rt,"rooms/damas/"+room),cb=s=>{let d=s.val();if(!d)return;bd=d.board||init();mcount=d.moveCount||0;forced=d.forced??-1;over=d.status==="finished";sel=-1;$("msg").textContent=over?(d.winner===side?"¡Ganaste!":"¡Ganó el rival!"):(d.turn===side?"Tu turno.":"Esperando al rival…");draw()};onValue(rr,cb);unsub=()=>off(rr,"value",cb)}
async function send(m){let rr=ref(rt,"rooms/damas/"+room);await runTransaction(rr,d=>{if(!d||d.status!=="playing"||d.turn!==side)return;let b=d.board||init(),ms=legal(b,side,d.forced??-1),x=ms.find(q=>q.from===m.from&&q.to===m.to);if(!x)return;let n=apply(b,x),p=n[x.to],cont=x.rm>=0&&!king(p)&&caps(n,x.to).length,next=cont?side:opp(side),ended=!legal(n,next).length;return{...d,board:n,turn:ended?side:next,forced:cont?x.to:-1,moveCount:(d.moveCount||0)+1,status:ended?"finished":"playing",winner:ended?side:null}})}
async function reward(win){try{let u=doc(fs,"users/"+user.uid),s=await getDoc(u),d=s.exists()?s.data():{};await setDoc(u,{xp:Number(d.xp||0)+(win?80:25),coins:Number(d.coins||0)+(win?15:5),wins:Number(d.wins||0)+(win?1:0),gamesPlayed:Number(d.gamesPlayed||0)+1},{merge:true})}catch(e){console.warn(e)}}
$("ai").onclick=()=>startAI("normal");$("online").onclick=online;document.querySelectorAll(".lev").forEach(x=>x.onclick=()=>startAI(x.dataset.l));$("create").onclick=createRoom;$("join").onclick=joinRoom;$("new").onclick=()=>mode==="ai"?startAI(level):room&&update(ref(rt,"rooms/damas/"+room),{board:init(),turn:R,forced:-1,moveCount:0,status:"playing",winner:null});$("leave").onclick=()=>location.reload();$("home1").onclick=$("home2").onclick=()=>location.reload();$("back").onclick=()=>location.href="../index.html";
onAuthStateChanged(auth,u=>{if(u)user=u;else signInAnonymously(auth)});bd=init();draw();
</script></body></html>
